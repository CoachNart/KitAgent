name: Apply home and live market upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply home and live stream
        run: node scripts/apply-home-live.mjs

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PerpetualsPage.jsx
          git diff --cached --quiet || git commit -m "feat: make home market-first and perps live [skip ci]"
          git push
