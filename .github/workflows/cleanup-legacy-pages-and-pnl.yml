name: Clean legacy frontend and repair PnL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean legacy frontend and repair PnL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          s = app.read_text()
          s = re.sub(r'\nfunction CommandCenter\(.*?\nfunction MarketPage\(', '\nfunction MarketPage(', s, flags=re.S)
          s = re.sub(r",\[command,setCommand\]=useState\(''\),\[messages,setMessages\]=useState\(\[\]\)", '', s)
          s = re.sub(r"\n  const runCommand=raw=>\{.*?\n  if\(showLoader\)", '\n  if(showLoader)', s, flags=re.S)
          s = re.sub(r"\nconst actions=.*?;\nconst nfts=.*?;\n", "\n", s, flags=re.S)
          for name in ['ArrowRight','Command','Layers3']:
              s = s.replace(', '+name, '')
          app.write_text(s)

          p = Path('src/PerpetualsPage.jsx')
          s = p.read_text()
          start = s.index('  const sharePnl = async p => {')
          end = s.index('  const estimatedMargin =', start)
          replacement = r'''  const pnlSvg = p => {
    const pnl=n(p.unRealizedPnl ?? p.unrealizedPnl ?? p.unrealisedPnl), entry=n(p.holdAvgPrice||p.openAvgPrice), mark=n(last), liq=n(p.liquidatePrice??p.liquidationPrice??p.liqPrice);
    const side=n(p.positionType)===1?'LONG':'SHORT', color=pnl>=0?'#25d6d0':'#ff5266', icon=pnl>=0?'↗':'↘', risk=stopOrders.find(o=>String(o.positionId)===String(p.positionId));
    const safe=v=>String(v??'—').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101922"/><stop offset=".6" stop-color="#080d13"/><stop offset="1" stop-color="#06090e"/></linearGradient><radialGradient id="g"><stop stop-color="${color}" stop-opacity=".2"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" rx="58" fill="url(#b)"/><circle cx="920" cy="90" r="360" fill="url(#g)"/><rect x="42" y="42" width="996" height="1266" rx="42" fill="none" stroke="#263141"/><text x="86" y="112" fill="#25d6d0" font-family="Arial" font-size="28" font-weight="700">KITSETUPS FUTURES</text><text x="86" y="148" fill="#66768a" font-family="Arial" font-size="17">LIVE POSITION · ${side}</text><text x="86" y="232" fill="#eef3f9" font-family="Arial" font-size="34" font-weight="700">${safe(displaySymbol(p.symbol))}</text><text x="86" y="278" fill="#66768a" font-family="Arial" font-size="19">${safe(profileName)}</text><text x="86" y="392" fill="#66768a" font-family="Arial" font-size="18">UNREALIZED PNL</text><text x="86" y="486" fill="${color}" font-family="Arial" font-size="78" font-weight="800">${icon} ${safe(fmt(pnl,4))}</text><text x="86" y="522" fill="#8b99aa" font-family="Arial" font-size="18">USDT</text><rect x="86" y="584" width="908" height="1" fill="#202c38"/><text x="86" y="650" fill="#66768a" font-family="Arial" font-size="16">ENTRY</text><text x="86" y="684" fill="#eef3f9" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(entry))}</text><text x="548" y="650" fill="#66768a" font-family="Arial" font-size="16">MARK</text><text x="548" y="684" fill="#eef3f9" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(mark))}</text><text x="86" y="758" fill="#66768a" font-family="Arial" font-size="16">SIZE</text><text x="86" y="792" fill="#eef3f9" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(p.holdVol))}</text><text x="548" y="758" fill="#66768a" font-family="Arial" font-size="16">LEVERAGE</text><text x="548" y="792" fill="#eef3f9" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(p.leverage,0))}x</text><text x="86" y="866" fill="#66768a" font-family="Arial" font-size="16">LIQUIDATION</text><text x="86" y="900" fill="#ff8a96" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(liq))}</text><text x="548" y="866" fill="#66768a" font-family="Arial" font-size="16">MARGIN</text><text x="548" y="900" fill="#eef3f9" font-family="Arial" font-size="25" font-weight="700">${safe(fmt(p.im,4))} USDT</text><rect x="86" y="956" width="908" height="170" rx="24" fill="#0b121a" stroke="#202c38"/><text x="120" y="1000" fill="#25d6d0" font-family="Arial" font-size="15" font-weight="700">RISK MANAGEMENT</text><text x="120" y="1042" fill="#66768a" font-family="Arial" font-size="15">STOP LOSS</text><text x="120" y="1074" fill="#eef3f9" font-family="Arial" font-size="21" font-weight="700">${safe(risk?.stopLossPrice||'Not set')}</text><text x="520" y="1042" fill="#66768a" font-family="Arial" font-size="15">TAKE PROFIT</text><text x="520" y="1074" fill="#eef3f9" font-family="Arial" font-size="21" font-weight="700">${safe(risk?.takeProfitPrice||'Not set')}</text><text x="86" y="1210" fill="#66768a" font-family="Arial" font-size="15">${safe(new Date().toLocaleString())}</text><text x="86" y="1248" fill="#25d6d0" font-family="Arial" font-size="16" font-weight="700">kitsetups.xyz</text></svg>`;
  };
  const svgToPng=svg=>new Promise((resolve,reject)=>{const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1350;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(Error('Could not render PnL image.')),'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not render PnL image.'))};img.src=url});
  const sharePnl=async p=>{try{const file=new File([await svgToPng(pnlSvg(p))],`kitsetups-${String(p.symbol||'position').replace(/[^a-z0-9_-]/gi,'')}-pnl.png`,{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'KitSetups Futures PnL',text:`${displaySymbol(p.symbol)} · ${side} · ${fmt(n(p.unRealizedPnl??p.unrealizedPnl??p.unrealisedPnl),4)} USDT`,files:[file]});return}if(navigator.share){await navigator.share({title:'KitSetups Futures PnL',text:`${displaySymbol(p.symbol)} · PnL ${fmt(n(p.unRealizedPnl??p.unrealizedPnl??p.unrealisedPnl),4)} USDT`});return}if(navigator.clipboard)await navigator.clipboard.writeText(`${profileName} · ${displaySymbol(p.symbol)} · PnL ${fmt(n(p.unRealizedPnl??p.unrealizedPnl??p.unrealisedPnl),4)} USDT`)}catch(e){if(e?.name!=='AbortError')setError(e.message||'Share was not available on this device.')}};
  const downloadPnl=async p=>{try{const blob=await svgToPng(pnlSvg(p)),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kitsetups-${String(p.symbol||'position').replace(/[^a-z0-9_-]/gi,'')}-pnl.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){setError(e.message||'Download was not available on this device.')}};

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          rm -f src/AgentTerminalLayer.jsx src/CommandAgentBridge.jsx src/agent-terminal.css
          git add src/App.jsx src/PerpetualsPage.jsx src/AgentTerminalLayer.jsx src/CommandAgentBridge.jsx src/agent-terminal.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'cleanup: remove legacy command page and fix PnL sharing'
          git push
          rm -f .github/workflows/cleanup-legacy-pages-and-pnl.yml
          git add .github/workflows/cleanup-legacy-pages-and-pnl.yml
          git commit -m 'chore: remove cleanup workflow'
          git push
