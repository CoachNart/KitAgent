name: Tighten Perpetuals UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-perps-ui.yml'

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore exact terminal with Hyperliquid layer
        run: node scripts/switch-perps-to-hyperliquid.mjs

      - name: Tighten UI and branded PnL sharing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/PerpetualsPage.jsx')
          s = p.read_text()

          s = s.replace('export default function PerpetualsPage(){', 'export default function PerpetualsPage({user}){')
          s = s.replace('Search all Bybit perpetuals…', 'Search all Hyperliquid perpetuals…')
          s = s.replace('Bybit connected', 'Hyperliquid connected')
          s = s.replace('Connect Bybit', 'Connect wallet')
          s = s.replace('Bybit Perpetuals', 'Hyperliquid Perpetuals')
          s = s.replace('Bybit', 'Hyperliquid')

          start = s.find(' const share=async()=>{')
          end = s.find(' const chart=', start)
          if start >= 0 and end > start:
              share_new = r""" const share=async()=>{
          if(!current)return say('No open position to share.');
          const pnl=Number(current.unrealizedPnl||current.unrealisedPnl||0);
          const sideLabel=current.side==='Buy'?'Long':'Short';
          const name=String(user?.displayName||user?.name||user?.email?.split('@')[0]||'Trader');
          const symbolLabel=String(current.symbol||'').replace('USDT','');
          const leverageLabel=current.leverage||leverage;
          const sizeLabel=n(current.size,4);
          const entry=usd(current.avgPrice);
          const mark=usd(current.markPrice);
          const pnlLabel=`${pnl>=0?'+':''}${usd(pnl)}`;
          try{
           const canvas=document.createElement('canvas'); canvas.width=1200; canvas.height=700;
           const ctx=canvas.getContext('2d'); if(!ctx)throw Error('Canvas unavailable');
           const grad=ctx.createLinearGradient(0,0,1200,700); grad.addColorStop(0,'#0a0f16'); grad.addColorStop(1,'#111a24');
           ctx.fillStyle=grad; ctx.fillRect(0,0,1200,700); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=2; ctx.strokeRect(28,28,1144,644);
           ctx.fillStyle='#fff'; ctx.font='700 38px Inter,Arial,sans-serif'; ctx.fillText('KitSetups',64,82);
           ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='500 22px Inter,Arial,sans-serif'; ctx.fillText('PERPETUALS · TRADE RESULT',64,118);
           ctx.fillStyle='#fff'; ctx.font='700 52px Inter,Arial,sans-serif'; ctx.fillText(`${symbolLabel}-PERP`,64,190);
           ctx.fillStyle=sideLabel==='Long'?'#27d7ff':'#ff4d5d'; ctx.font='700 28px Inter,Arial,sans-serif'; ctx.fillText(`${sideLabel} · ${leverageLabel}x`,64,232);
           ctx.fillStyle=pnl>=0?'#27d7ff':'#ff4d5d'; ctx.font='800 86px Inter,Arial,sans-serif'; ctx.fillText(pnlLabel,64,350);
           ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='500 20px Inter,Arial,sans-serif'; ctx.fillText('UNREALIZED PNL',66,386);
           const items=[['Trader',name],['Size',`${sizeLabel} contracts`],['Entry',entry],['Mark',mark]];
           items.forEach((it,i)=>{const x=64+(i%2)*520,y=470+Math.floor(i/2)*72;ctx.fillStyle='rgba(255,255,255,.42)';ctx.font='500 18px Inter,Arial,sans-serif';ctx.fillText(it[0].toUpperCase(),x,y);ctx.fillStyle='#fff';ctx.font='650 24px Inter,Arial,sans-serif';ctx.fillText(it[1],x,y+30)});
           ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font='500 16px Inter,Arial,sans-serif'; ctx.fillText('Shared from KitSetups',64,635);
           const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',.94));
           if(blob&&navigator.share&&navigator.canShare){const file=new File([blob],`kitsetups-${symbolLabel.toLowerCase()}-pnl.png`,{type:'image/png'});if(navigator.canShare({files:[file]})){await navigator.share({title:`KitSetups · ${symbolLabel} PnL`,text:`${name} · ${sideLabel} ${leverageLabel}x · ${pnlLabel}`,files:[file]});return}}
           if(blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`kitsetups-${symbolLabel.toLowerCase()}-pnl.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('PnL card generated.');return}
          }catch{}
          const text=`KitSetups · ${name} · ${symbolLabel}-PERP\n${sideLabel} ${leverageLabel}x · PnL ${pnlLabel}\nSize ${sizeLabel} · Entry ${entry} · Mark ${mark}`;
          try{if(navigator.share)await navigator.share({title:'KitSetups PnL',text});else await navigator.clipboard.writeText(text);say('PnL copied.')}catch{}
         };
"""
              s = s[:start] + share_new + s[end:]

          css = """
/* KitSetups perpetual polish */
.ka-perps .book{overflow:visible!important;min-height:0!important}
.ka-perps .book .mid{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:5!important;min-height:30px!important;line-height:30px!important}
.ka-perps .account-panel{min-width:0!important;overflow:visible!important}
.ka-perps .account-panel .tabs{padding:4px!important;gap:3px!important}
.ka-perps .account-panel .tabs button{padding:8px 12px!important;font-size:12px!important;border-radius:9px!important}
.ka-perps .account-panel .row{gap:7px!important;padding:9px!important;align-items:center!important;overflow:visible!important}
.ka-perps .account-panel .row button{visibility:visible!important;opacity:1!important;white-space:nowrap!important}
.ka-perps .account-panel .row button svg{flex:none!important}
.ka-perps .account-panel .position-actions{display:flex!important;gap:6px!important;align-items:center!important;justify-content:flex-end!important;flex-wrap:wrap!important}
.ka-perps .account-panel .position-actions button{min-height:32px!important;padding:7px 10px!important}
.ka-perps .account-panel .share-pnl,.ka-perps .account-panel .close-trade{display:inline-flex!important;visibility:visible!important}
.ka-perps .two{gap:8px!important}
.ka-perps .book{padding:8px!important}
.ka-perps .book header{padding:5px 6px 8px!important}
.ka-perps .book p{padding:4px 6px!important;min-height:22px!important}
.ka-perps .trade-panel,.ka-perps .chart-panel,.ka-perps .book,.ka-perps .account-panel{border-radius:14px!important}
.ka-perps .trade-panel{padding:12px!important}
.ka-perps .pf{margin-bottom:7px!important}
@media(max-width:700px){.ka-perps .account-panel .row{grid-template-columns:minmax(0,1fr)!important}.ka-perps .account-panel .position-actions{justify-content:stretch!important}.ka-perps .account-panel .position-actions button{flex:1 1 120px!important}.ka-perps .book .mid{font-size:13px!important}}
"""
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s)

          app = Path('src/App.jsx')
          a = app.read_text()
          a = a.replace('<PerpetualsPage wallet={wallet} connectWallet={connectWallet}/>', '<PerpetualsPage wallet={wallet} user={user} connectWallet={connectWallet}/>')
          app.write_text(a)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PerpetualsPage.jsx src/App.jsx
          git diff --cached --quiet || git commit -m 'fix: polish perpetual terminal and branded pnl card'
          git push
