name: Monthly affiliate payouts

on:
  schedule:
    - cron: '5 0 1 * *'
  workflow_dispatch:

jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - name: Run payout worker
        env:
          CRON_SECRET: ${{ secrets.AFFILIATE_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $CRON_SECRET" https://kitagent.vercel.app/api/affiliate-payout
