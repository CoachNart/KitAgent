name: Build KitSetups Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Prepare Android project
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android project exists; syncing it."
          else
            echo "Android project is missing or incomplete; recreating it."
            rm -rf android
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply native branding
        run: |
          set -e
          test -f android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/kitsetups_icon.xml android/app/src/main/res/drawable/kitsetups_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/kitsetups_icon"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/kitsetups_icon"')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'kitsetups_icon'
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KitSetups-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30