name: Build KitAgent Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Package APK
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/KitAgent-debug.apk
          cd android-artifact
          zip -j KitAgent-Android-debug.zip KitAgent-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KitAgent-Android-debug
          path: android-artifact/KitAgent-Android-debug.zip
          if-no-files-found: error
          retention-days: 30
