name: Build KitSetups Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply KitSetups native branding
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/kitsetups_icon.xml android/app/src/main/res/drawable/kitsetups_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/kitsetups_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/kitsetups_icon"')
          p.write_text(s)

          gradle = Path('android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('versionCode 1', 'versionCode 233')
              g = g.replace('versionName "1.0"', 'versionName "2.3.3"')
              gradle.write_text(g)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK branding
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'kitsetups_icon'

      - name: Package APK
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/KitSetups-debug.apk
          cd android-artifact
          zip -j KitSetups-Android-debug.zip KitSetups-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KitSetups-Android-debug
          path: android-artifact/KitSetups-Android-debug.zip
          if-no-files-found: error
          retention-days: 30
