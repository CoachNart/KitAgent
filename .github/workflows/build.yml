name: Build KitAgent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply final platform hardening once
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'final platform hardening') }}
        run: |
          node scripts/final-hardening-v2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src api vercel.json
          git rm --ignore-unmatch src/walletConnector.js || true
          git diff --cached --quiet || git commit -m 'fix: final platform hardening [skip ci]'
          git push
      - name: Apply requested UI and market cleanup
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'cleanup navigation and market auth') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          s = app.read_text()

          # One canonical Profile destination; Home uses a home icon and Airdrops keeps its rocket icon.
          s = s.replace('History, Layers3, LockKeyhole', 'History, House, Layers3, LockKeyhole')
          nav = "const nav=[['home','Home',House],['market','Market analysis',BarChart3],['defi','DeFi & actions',Layers3],['perps','Perpetuals',Zap],['drops','Airdrops & faucets',Rocket],['activity','History',History],['profile','Profile',UserRound]];"
          s = re.sub(r'const nav=\[[^\n]*?\];', nav, s, count=1)

          if "import SignalHistory from './SignalHistory.jsx';" not in s:
              s = s.replace("import PerpetualsPage from './PerpetualsPage.jsx';", "import PerpetualsPage from './PerpetualsPage.jsx';\nimport SignalHistory from './SignalHistory.jsx';")
          if "import AccessGate from './AccessGate.jsx';" not in s:
              s = s.replace("import HomePage from './HomePage.jsx';", "import HomePage from './HomePage.jsx';\nimport AccessGate from './AccessGate.jsx';\nimport LiveMarketPage from './LiveMarketPage.jsx';")

          # Replace Activity with the existing signal/history implementation and remove the old page implementation.
          s = s.replace("{page==='activity'&&<ActivityPage activity={activity}/>}", "{page==='activity'&&<SignalHistory/>}")
          s = re.sub(r'\nfunction ActivityPage\(\{activity\}\)\{.*?\}\nfunction ProfilePage', '\nfunction ProfilePage', s, count=1, flags=re.S)

          # Use the authenticated live market page instead of the local unauthenticated placeholder.
          s = re.sub(r"\{page==='market'&&<MarketPage pair=\{pair\} setPair=\{setPair\} tf=\{tf\} setTf=\{setTf\} analyzed=\{analyzed\} setAnalyzed=\{setAnalyzed\}/>\}", "{page==='market'&&<AccessGate user={user}><LiveMarketPage/></AccessGate>}", s, count=1)
          app.write_text(s)

          market = Path('src/LiveMarketPage.jsx')
          m = market.read_text()
          old = "const endpoint='/api/market';const r=await fetch(`${endpoint}?market=${encodeURIComponent(market)}&symbol=${encodeURIComponent(symbolFor(market,pair))}&timeframe=${encodeURIComponent(timeframe)}`);"
          new = "const endpoint='/api/market';const token=auth?.currentUser?await auth.currentUser.getIdToken(true):'';const r=await fetch(`${endpoint}?market=${encodeURIComponent(market)}&symbol=${encodeURIComponent(symbolFor(market,pair))}&timeframe=${encodeURIComponent(timeframe)}`,{headers:token?{Authorization:`Bearer ${token}`}:{}});"
          if old in m:
              m = m.replace(old, new)
          old_err = "if(!r.ok||!body.ok)throw new Error(body.error||`Market analysis failed (${r.status})`);"
          new_err = "if(!r.ok||!body.ok){if(r.status===401)throw new Error('Your session has expired. Please sign in again.');if(r.status===403){window.dispatchEvent(new CustomEvent('kitagent-open-profile'));throw new Error(body.error||'Your trial or Premium access has expired.')}throw new Error(body.error||`Market analysis failed (${r.status})`);}"
          m = m.replace(old_err, new_err)
          market.write_text(m)

          # Keep the build-time normalizers aligned with the canonical navigation.
          for name in ['scripts/normalize-nav-icons.mjs', 'scripts/restore-activity-profile-brand.mjs']:
              p = Path(name)
              if p.exists():
                  x = p.read_text().replace("['drops','Airdrops & faucets',UserRound]", "['drops','Airdrops & faucets',Rocket]")
                  if "scripts/restore-activity-profile-brand.mjs" in name:
                      x = x.replace("['home','Home',House],['market'", "['home','Home',House],['market'")
                  p.write_text(x)

          # The unused duplicate account/profile implementation is intentionally removed.
          Path('src/AccountPage.jsx').unlink(missing_ok=True)
          print('Requested KitAgent cleanup applied.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          git rm --ignore-unmatch src/AccountPage.jsx || true
          if ! git diff --cached --quiet; then
            git commit -m 'fix: apply requested navigation history and market auth cleanup [skip ci]'
            git push
          fi
      - run: npm install
      - run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
