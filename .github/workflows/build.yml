name: Build KitAgent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply KitSetups builder fee
        run: |
          node scripts/add-builder-fee.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PerpetualsPage.jsx
          git diff --cached --quiet || git commit -m "feat: enable KitSetups builder fee on Hyperliquid [skip ci]"
          git push
      - run: npm install
      - run: npm run build
