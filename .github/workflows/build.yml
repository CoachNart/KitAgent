name: Build KitAgent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply final platform hardening once
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'final platform hardening') }}
        run: |
          node scripts/final-hardening-v2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src api vercel.json
          git rm --ignore-unmatch src/walletConnector.js || true
          git diff --cached --quiet || git commit -m 'fix: final platform hardening [skip ci]'
          git push
      - name: Repair duplicate App imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace("import AccessGate from './AccessGate.jsx';\n", '')
          s = s.replace("import LiveMarketPage from './LiveMarketPage.jsx';\n", '')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove duplicate App imports [skip ci]'
            git push
          fi
      - run: npm install
      - run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
