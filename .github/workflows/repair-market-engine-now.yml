name: Repair market engine now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical strategy-engine repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/market.js')
          s=p.read_text()

          # Do not let a neutral higher-timeframe structure globally short-circuit
          # every strategy. Each strategy must decide its own evidence requirements.
          s=s.replace(
            "if(bias==='WAIT'&&key!=='LIQUIDITY_REVERSAL'&&key!=='CRT'){",
            "if(bias==='WAIT'&&key==='TOP_DOWN'){"
          )

          # Breakout: evaluate both directions. A higher-timeframe neutral state
          # is not the same thing as no breakout; the completed execution chart
          # can contain a decisive range break in either direction.
          old="""  } else if(key==='BREAKOUT'){
    const signal=breakoutSignal(current,bias),accepted=Boolean(signal&&((bias==='LONG'&&signal.breakCandle.close>signal.breakLevel)||(bias==='SHORT'&&signal.breakCandle.close<signal.breakLevel))),retest=Boolean(signal&&(signal.retest||signal.breakIndex===current.length-1));
    let chosen=null;
    if(signal&&accepted){
      const t=evaluateTrade(current,bias,livePrice,a,SETUP_MIN_RR);
      if(t&&validTrade(t,bias,livePrice,'MARKET'))chosen={trade:t,entry:livePrice,orderType:'MARKET'};
      if(!chosen){
        const pending=evaluateTrade(current,bias,signal.breakLevel,a,SETUP_MIN_RR);
        if(pending&&validTrade(pending,bias,livePrice,'LIMIT'))chosen={trade:pending,entry:signal.breakLevel,orderType:'LIMIT',zone:{mid:signal.breakLevel,index:signal.breakIndex,type:'BREAKOUT RETEST'}};
      }
    }
    if(chosen){trade=chosen.trade;entry=chosen.entry;orderType=chosen.orderType;}
    reason=trade?'A compressed range broke decisively and the confirmed break level is executable.':'Waiting for a true range breakout, decisive close and an executable continuation level.';
    evidence.push(signal?'Compressed range '+roundPrice(signal.range.low)+' — '+roundPrice(signal.range.high)+'.':'No qualifying compression range.',signal?'Breakout close confirmed.':'No decisive breakout close.',retest?'Broken level retested.':'No breakout retest.');"""
          new="""  } else if(key==='BREAKOUT'){
    const directions=(higherBias!=='WAIT'?[higherBias]:[]).concat(selectedBias!=='WAIT'?[selectedBias]:[]).concat(['LONG','SHORT']);
    let chosen=null,signal=null,signalBias='WAIT';
    for(const candidateBias of [...new Set(directions)]){
      const candidate=breakoutSignal(current,candidateBias);
      if(!candidate)continue;
      const accepted=(candidateBias==='LONG'&&candidate.breakCandle.close>candidate.breakLevel)||(candidateBias==='SHORT'&&candidate.breakCandle.close<candidate.breakLevel);
      if(!accepted)continue;
      const marketTrade=evaluateTrade(current,candidateBias,livePrice,a,SETUP_MIN_RR);
      if(marketTrade&&validTrade(marketTrade,candidateBias,livePrice,'MARKET')){chosen={trade:marketTrade,entry:livePrice,orderType:'MARKET'};signal=candidate;signalBias=candidateBias;break;}
      const pending=evaluateTrade(current,candidateBias,candidate.breakLevel,a,SETUP_MIN_RR);
      if(pending&&validTrade(pending,candidateBias,livePrice,'LIMIT')){chosen={trade:pending,entry:candidate.breakLevel,orderType:'LIMIT',zone:{mid:candidate.breakLevel,index:candidate.breakIndex,type:'BREAKOUT RETEST'}};signal=candidate;signalBias=candidateBias;break;}
    }
    if(chosen){trade=chosen.trade;entry=chosen.entry;orderType=chosen.orderType;bias=signalBias;}
    const retest=Boolean(signal&&(signal.retest||signal.breakIndex===current.length-1));
    reason=trade?'A compressed range broke decisively and the confirmed break level is executable.':'Waiting for a true range breakout, decisive close and an executable continuation level.';
    evidence.push(signal?'Compressed range '+roundPrice(signal.range.low)+' — '+roundPrice(signal.range.high)+'.':'No qualifying compression range.',signal?'Breakout close confirmed.':'No decisive breakout close.',retest?'Broken level retested.':'No breakout retest.');"""
          if old not in s: raise SystemExit('BREAKOUT block not found')
          s=s.replace(old,new,1)

          # SMC: keep the sequence meaningful but permit either a BOS or CHoCH
          # structural confirmation after a real sweep and displacement. This
          # removes an unnecessary requirement for two separate break detectors
          # to fire on the same move.
          old="""    const validSequence=Boolean(sweep&&choch&&choch.breakIndex>sweep.index&&disp&&disp.index>=choch.breakIndex);
    const sequenceBos=Boolean(bos&&bos.breakIndex>=choch?.breakIndex);
    let chosen=null;
    if(validSequence&&smcBias!=='WAIT'){
      if(zones.length)chosen=(zoneTouchesCandle(current,zones[0])?chooseMarketFromZones(zones,smcBias):null)||chooseLimitForBias(zones,smcBias,livePrice);
      // If the original POI has been consumed, the post-BOS structural level
      // remains a valid SMC retest location.
      if(!chosen&&(bos||choch)){
        const level=sequenceBos?bos.level:choch.level;
        const levelIndex=sequenceBos?bos.breakIndex:choch.breakIndex;
        const pending=evaluateTrade(current,smcBias,level,a,SETUP_MIN_RR);
        if(pending&&validTrade(pending,smcBias,livePrice,'LIMIT'))chosen={trade:pending,entry:level,orderType:'LIMIT',zone:{mid:level,index:levelIndex,type:sequenceBos?'SMC BOS RETEST':'SMC CHoCH RETEST'}};
      }
    }"""
          new="""    const validSequence=Boolean(sweep&&disp&&((choch&&choch.breakIndex>sweep.index&&disp.index>=choch.breakIndex)||(bos&&bos.breakIndex>sweep.index&&disp.index>=bos.breakIndex)));
    const sequenceBos=Boolean(bos&&(!choch||bos.breakIndex>=choch.breakIndex));
    let chosen=null;
    if(validSequence&&smcBias!=='WAIT'){
      if(zones.length)chosen=(zoneTouchesCandle(current,zones[0])?chooseMarketFromZones(zones,smcBias):null)||chooseLimitForBias(zones,smcBias,livePrice);
      if(!chosen&&(bos||choch)){
        const level=sequenceBos?bos.level:choch.level;
        const levelIndex=sequenceBos?bos.breakIndex:choch.breakIndex;
        const pending=evaluateTrade(current,smcBias,level,a,SETUP_MIN_RR);
        if(pending&&validTrade(pending,smcBias,livePrice,'LIMIT'))chosen={trade:pending,entry:level,orderType:'LIMIT',zone:{mid:level,index:levelIndex,type:sequenceBos?'SMC BOS RETEST':'SMC CHoCH RETEST'}};
      }
    }"""
          if old not in s: raise SystemExit('SMC sequence block not found')
          s=s.replace(old,new,1)

          # MSNR: a fresh level can be staged as a LIMIT when the lower timeframe
          # has already shown the formation/reaction. It does not have to be
          # physically touched by the current candle first.
          old="const active=nearFresh||nearFlip;"
          new="const active=nearFresh||nearFlip||freshLevels[0]||flipLevels[0];"
          if old not in s: raise SystemExit('MSNR active block not found')
          s=s.replace(old,new,1)

          # Liquidity reversal: search both directions when HTF context is neutral.
          old="""    const revBias=higherBias!=='WAIT'?higherBias:(selectedBias!=='WAIT'?selectedBias:entryStructure.trend),sweep=revBias!=='WAIT'?liquiditySweep(current,revBias,30,12):null,reclaim=Boolean(sweep&&current.slice(sweep.index).some(x=>revBias==='LONG'?x.close>sweep.level:x.close<sweep.level)),choch=revBias!=='WAIT'?changeOfCharacter(current,revBias,60,12):null,disp=revBias!=='WAIT'?recentDisplacement(current,revBias,sweep?.index??Math.max(0,current.length-12),current.length-1):null,retest=Boolean(sweep&&current.slice(sweep.index+1).some(x=>revBias==='LONG'?x.low<=sweep.level:x.high>=sweep.level));
    const reversalSequence=Boolean(revBias!=='WAIT'&&sweep&&reclaim&&choch&&choch.breakIndex>sweep.index&&disp&&disp.index>=choch.breakIndex);
    const t=reversalSequence?evaluateTrade(current,revBias,sweep.level,a,SETUP_MIN_RR):null;
    if(reversalSequence){
      const mt=evaluateTrade(current,revBias,livePrice,a,SETUP_MIN_RR);
      if(retest&&mt&&validTrade(mt,revBias,livePrice,'MARKET')){trade=mt;entry=livePrice;orderType='MARKET';bias=revBias;}
      if(!trade&&t&&validTrade(t,revBias,livePrice,'LIMIT')){trade=t;entry=sweep.level;orderType='LIMIT';bias=revBias;}
    }"""
          new="""    const revDirections=[...(higherBias!=='WAIT'?[higherBias]:[]),...(selectedBias!=='WAIT'?[selectedBias]:[]),'LONG','SHORT'];
    let revBias='WAIT',sweep=null,reclaim=false,choch=null,disp=null,retest=false;
    for(const candidateBias of [...new Set(revDirections)]){
      const cs=liquiditySweep(current,candidateBias,30,18);
      if(!cs)continue;
      const cr=Boolean(current.slice(cs.index).some(x=>candidateBias==='LONG'?x.close>cs.level:x.close<cs.level));
      const cc=changeOfCharacter(current,candidateBias,60,18);
      const cd=recentDisplacement(current,candidateBias,cs.index, current.length-1);
      const valid=Boolean(cr&&cc&&cc.breakIndex>cs.index&&cd&&cd.index>=cc.breakIndex);
      if(!valid)continue;
      const rt=Boolean(current.slice(cs.index+1).some(x=>candidateBias==='LONG'?x.low<=cs.level:x.high>=cs.level));
      const mt=evaluateTrade(current,candidateBias,livePrice,a,SETUP_MIN_RR);
      const lt=evaluateTrade(current,candidateBias,cs.level,a,SETUP_MIN_RR);
      if(rt&&mt&&validTrade(mt,candidateBias,livePrice,'MARKET')){trade=mt;entry=livePrice;orderType='MARKET';bias=candidateBias;}
      else if(lt&&validTrade(lt,candidateBias,livePrice,'LIMIT')){trade=lt;entry=cs.level;orderType='LIMIT';bias=candidateBias;}
      if(trade){revBias=candidateBias;sweep=cs;reclaim=cr;choch=cc;disp=cd;retest=rt;break;}
    }"""
          if old not in s: raise SystemExit('LIQUIDITY block not found')
          s=s.replace(old,new,1)

          # Pullback: don't allow a tiny stop to create a tiny 2R scalp. The
          # evaluator's minimum risk is widened slightly while retaining 2R.
          s=s.replace("const minimumRisk=Math.max(a*.25,entry*.0005);","const minimumRisk=Math.max(a*.35,entry*.0005);",1)

          # Structural stop candidates may be too sparse on a very short chart.
          # Fall back to confirmed swing invalidation only when it remains inside
          # the risk envelope; never move the stop inward to manufacture RR.
          old="""  const valid=candidates
    .map(x=>{
      const stop=bias==='LONG'?x.level-buffer:x.level+buffer;
      return {...x,stop,distance:Math.abs(entry-stop)};
    })"""
          new="""  const fallbackSwings=(bias==='LONG'?marketStructure(c).lows:marketStructure(c).highs).slice(-10);
  for(const x of fallbackSwings){
    if(!Number.isFinite(x.p)||c.length-1-x.i>80)continue;
    if(!candidates.some(q=>Math.abs(q.level-x.p)<=Math.max(a*.12,entry*.0005)))candidates.push({level:x.p,quality:1,lastIndex:x.i,touches:1,source:'CONFIRMED SWING'});
  }
  const valid=candidates
    .map(x=>{
      const stop=bias==='LONG'?x.level-buffer:x.level+buffer;
      return {...x,stop,distance:Math.abs(entry-stop)};
    })"""
          if old not in s: raise SystemExit('stop candidate block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check api/market.js
      - name: Commit repaired engine and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/market.js
          git rm .github/workflows/repair-market-engine-now.yml
          git commit -m "Surgical repair of dead strategy execution paths"
          git push
