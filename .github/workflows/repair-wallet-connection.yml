name: Repair wallet connection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'trigger wallet repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/repair-wallet-connection.mjs
      - run: npm install
      - run: npm run build
      - name: Commit repaired terminal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PerpetualsPage.jsx
          git diff --cached --quiet || git commit -m 'fix: enable universal wallet connection [skip ci]'
          git push
