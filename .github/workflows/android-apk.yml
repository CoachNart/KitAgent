name: Build KitSetups Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply KitSetups native branding
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/kitsetups_icon.xml android/app/src/main/res/drawable/kitsetups_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/kitsetups_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/kitsetups_icon"')
          s = s.replace('android:theme="@style/AppTheme.NoActionBarLaunch"', 'android:theme="@style/AppTheme.NoActionBarLaunch" android:usesCleartextTraffic="false" android:resizeableActivity="true"')
          marker = '</activity>'
          deep_link = '''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="https" android:host="kitsetups.xyz" />\n                <data android:scheme="https" android:host="www.kitsetups.xyz" />\n            </intent-filter>\n          '''
          if 'android:host="kitsetups.xyz"' not in s:
              s = s.replace(marker, deep_link + marker, 1)
          p.write_text(s)

          gradle = Path('android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('versionCode 1', 'versionCode 233')
              g = g.replace('versionName "1.0"', 'versionName "2.3.3"')
              gradle.write_text(g)
          PY

      - name: Build fresh install APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/public'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'kitsetups_icon'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitSetups-2.3.3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
