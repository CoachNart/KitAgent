name: Final platform hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'final platform hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/final-hardening-v2.mjs
      - run: npm install
      - run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
      - name: Commit final hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src api vercel.json
          git rm --ignore-unmatch src/walletConnector.js || true
          git diff --cached --quiet || git commit -m 'fix: final platform hardening [skip ci]'
          git push
