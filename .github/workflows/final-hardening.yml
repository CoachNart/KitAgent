name: Final platform hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run platform hardening checks
        run: node scripts/platform-hardening-check.mjs
      - name: Production web build
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build