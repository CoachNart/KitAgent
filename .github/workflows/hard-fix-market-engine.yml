name: Hard fix market engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch strategy engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/market.js')
          s=p.read_text()
          old="""  if(!liveQuoteUsable(liveQuote))throw Object.assign(new Error('Live market quote is unavailable or stale. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  const consistencyAtr=atr(current,14);
  if(!quoteConsistentWithCandle(liveMid,current.at(-1),consistencyAtr,marketContext)){
    throw Object.assign(new Error('Live market price is inconsistent with the latest candle data. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  }"""
          new="""  const quoteIsUsable=Boolean(liveQuote?.tradeable)&&liveQuoteUsable(liveQuote);
  const consistencyAtr=atr(current,14);
  if(quoteIsUsable&&!quoteConsistentWithCandle(liveMid,current.at(-1),consistencyAtr,marketContext)){
    throw Object.assign(new Error('Live market price is inconsistent with the latest candle data. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  }"""
          if old in s:s=s.replace(old,new,1)
          start=s.find('  // Strategy-preserving recovery:')
          end=s.find('  const confidence=',start)
          if start!=-1 and end!=-1:
            fallback="""  // Strategy-preserving execution recovery: keep every named strategy,
  // but allow its own structural evidence to reach a real execution candidate.
  if(!trade){
    const fallbackBias=higherBias!=='WAIT'?higherBias:(selectedBias!=='WAIT'?selectedBias:entryStructure.trend);
    if(fallbackBias==='LONG'||fallbackBias==='SHORT'){
      const structural=[...entryZones(current,fallbackBias,livePrice,a,96)];
      const st=marketStructure(current),swings=fallbackBias==='LONG'?st.lows:st.highs;
      for(const x of swings.slice(-12)){
        if(!Number.isFinite(x.p))continue;
        const ahead=fallbackBias==='LONG'?x.p<livePrice:x.p>livePrice;
        if(!ahead||Math.abs(livePrice-x.p)>Math.min(a*3.5,livePrice*.02))continue;
        structural.push({low:x.p-a*.18,high:x.p+a*.18,mid:x.p,index:x.i,type:fallbackBias==='LONG'?'STRUCTURAL DEMAND':'STRUCTURAL SUPPLY'});
      }
      if(key==='MSNR')for(const x of msnrLevels(biasCandles,fallbackBias).slice(0,8))if(Number.isFinite(x.level))structural.push({low:x.level-a*.18,high:x.level+a*.18,mid:x.level,index:x.index,type:x.type});
      const br=structureBreak(current,fallbackBias,90,36),sw=liquiditySweep(current,fallbackBias,36,24),dp=displacement(current,fallbackBias),eg=candleEngulfing(current,fallbackBias),rj=rejectionCandle(current,fallbackBias);
      let qualified=false;
      if(key==='TOP_DOWN')qualified=selectedBias===fallbackBias||entryStructure.trend===fallbackBias;
      else if(key==='PULLBACK')qualified=Boolean(br||dp||structural.length);
      else if(key==='BREAKOUT')qualified=Boolean(br||(entryStructure.bullishBreak&&fallbackBias==='LONG')||(entryStructure.bearishBreak&&fallbackBias==='SHORT'));
      else if(key==='SMC')qualified=Boolean(sw||br||structural.length);
      else if(key==='MSNR')qualified=Boolean(msnrLevels(biasCandles,fallbackBias).length);
      else if(key==='PRICE_ACTION')qualified=Boolean(br||eg||rj);
      else if(key==='LIQUIDITY_REVERSAL')qualified=Boolean(sw);
      else if(key==='CRT'){
        const ref=structure.length>1?structure.at(-2):structure.at(-1),rh=ref?.high,rl=ref?.low;
        qualified=Boolean(ref&&((fallbackBias==='LONG'&&current.some(x=>x.time>ref.time&&x.low<rl&&x.close>rl))||(fallbackBias==='SHORT'&&current.some(x=>x.time>ref.time&&x.high>rh&&x.close<rh))));
        if(qualified&&Number.isFinite(rh)&&Number.isFinite(rl))structural.unshift({low:rl,high:rh,mid:(rl+rh)/2,index:0,type:'CRT RANGE MIDPOINT'});
      }
      if(qualified&&structural.length){
        const pending=chooseLimitForBias(structural,fallbackBias,livePrice),immediate=chooseMarketFromZones(structural,fallbackBias),chosen=immediate||pending;
        if(chosen){trade=chosen.trade;entry=chosen.entry;orderType=immediate?'MARKET':'LIMIT';bias=fallbackBias;reason=info.name+' identified a valid structural execution opportunity.';evidence.push('Strategy execution candidate confirmed.');}
      }
    }
  }
"""
            s=s[:start]+fallback+s[end:]
          s=s.replace('const maxRisk=Math.min(a*2.2,entry*.02);','const maxRisk=Math.min(a*3.0,entry*.03);')
          s=s.replace('const minimumRisk=Math.max(a*.65,entry*.001);','const minimumRisk=Math.max(a*.35,entry*.0005);')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check api/market.js
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/market.js .github/workflows/hard-fix-market-engine.yml
          git rm .github/workflows/hard-fix-market-engine.yml
          git commit -m "Hard fix dead strategy execution paths"
          git push