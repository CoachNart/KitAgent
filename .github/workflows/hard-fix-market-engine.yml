name: Hard fix market engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch strategy engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/market.js')
          s=p.read_text()

          # Stale/inconsistent live quotes must not kill candle-backed LIMIT setups.
          old="""  if(!liveQuoteUsable(liveQuote))throw Object.assign(new Error('Live market quote is unavailable or stale. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  const consistencyAtr=atr(current,14);
  if(!quoteConsistentWithCandle(liveMid,current.at(-1),consistencyAtr,marketContext)){
    throw Object.assign(new Error('Live market price is inconsistent with the latest candle data. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  }"""
          new="""  const quoteIsUsable=Boolean(liveQuote?.tradeable)&&liveQuoteUsable(liveQuote);
  const consistencyAtr=atr(current,14);
  if(quoteIsUsable&&!quoteConsistentWithCandle(liveMid,current.at(-1),consistencyAtr,marketContext)){
    throw Object.assign(new Error('Live market price is inconsistent with the latest candle data. No setup was issued.'),{code:'MARKET_DATA_PRICE_UNAVAILABLE'});
  }"""
          if old in s:
              s=s.replace(old,new,1)

          # Replace the previous recovery block without changing the named strategies
          # or the 2R quality floor. The fallback only stages a structurally derived
          # candidate when that strategy has its own qualifying evidence.
          start=s.find('  // Strategy-preserving recovery:')
          end=s.find('  const confidence=',start)
          if start==-1 or end==-1:
              raise SystemExit('strategy recovery block not found')

          fallback=r'''  // Strategy-preserving structural execution recovery.
  if(!trade){
    const localTrend=structureBias(marketStructure(current));
    const structuralTrend=structureBias(marketStructure(structure));
    const fallbackBias=higherBias!=='WAIT'?higherBias:(structuralTrend!=='WAIT'?structuralTrend:localTrend);

    if(fallbackBias==='LONG'||fallbackBias==='SHORT'){
      const structural=[...entryZones(current,fallbackBias,livePrice,a,96),...structuralEntryZones(current,fallbackBias,livePrice,a,60)];
      const br=structureBreak(current,fallbackBias,90,36);
      const sw=liquiditySweep(current,fallbackBias,36,24);
      const dp=displacement(current,fallbackBias);
      const eg=candleEngulfing(current,fallbackBias);
      const rj=rejectionCandle(current,fallbackBias);
      const msnr=typeof msnrLevels==='function'?msnrLevels(biasCandles,fallbackBias):[];

      if(key==='MSNR'){
        for(const x of msnr.slice(0,8)){
          if(!Number.isFinite(x?.level))continue;
          structural.push({low:x.level-a*.18,high:x.level+a*.18,mid:x.level,index:x.index??0,type:x.type||'MSNR LEVEL'});
        }
      }

      let qualified=false;
      if(key==='TOP_DOWN'){
        qualified=(selectedBias===fallbackBias||selectedBias==='WAIT')&&(structuralTrend===fallbackBias||localTrend===fallbackBias);
      } else if(key==='PULLBACK'){
        qualified=Boolean(br||dp||structural.length);
      } else if(key==='BREAKOUT'){
        qualified=Boolean(br);
      } else if(key==='SMC'){
        qualified=Boolean(sw||br);
      } else if(key==='MSNR'){
        qualified=Boolean(msnr.length);
      } else if(key==='PRICE_ACTION'){
        qualified=Boolean(br||eg||rj);
      } else if(key==='LIQUIDITY_REVERSAL'){
        qualified=Boolean(sw);
      } else if(key==='CRT'){
        qualified=false;
      }

      if(qualified&&structural.length){
        for(const zone of structural){
          const candidateEntry=zone.mid;
          const pendingTrade=evaluateTrade(current,fallbackBias,candidateEntry,a,SETUP_MIN_RR);
          if(!pendingTrade)continue;

          const touched=zoneTouchesCandle(current,zone,last);
          if(touched){
            const marketTrade=evaluateTrade(current,fallbackBias,livePrice,a,SETUP_MIN_RR);
            if(marketTrade&&validTrade(marketTrade,fallbackBias,livePrice,'MARKET')){
              trade=marketTrade;
              entry=livePrice;
              orderType='MARKET';
              bias=fallbackBias;
              reason=info.name+' identified a confirmed structural execution opportunity at the live market price.';
              evidence.push('Structural execution: '+zone.type+'.');
              break;
            }
          }

          if(validTrade(pendingTrade,fallbackBias,livePrice,'LIMIT')){
            trade=pendingTrade;
            entry=candidateEntry;
            orderType='LIMIT';
            bias=fallbackBias;
            reason=info.name+' identified a confirmed structural retracement zone with sufficient room for the risk model.';
            evidence.push('Structural execution: '+zone.type+'.');
            break;
          }
        }
      }
    }
  }
'''
          s=s[:start]+fallback+s[end:]

          # Avoid a ReferenceError if an older branch lacks the optional helper.
          s=s.replace(
              "const formation=msnrFormation(current,bias);",
              "const formation=typeof msnrFormation==='function'?msnrFormation(current,bias):null;",
              1
          )

          # Preserve the existing structural risk model and 2R minimum.
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check api/market.js
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/market.js .github/workflows/hard-fix-market-engine.yml
          git rm .github/workflows/hard-fix-market-engine.yml
          git commit -m "Hard fix strategy execution paths and stale quote handling"
          git push
