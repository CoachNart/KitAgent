name: Market Engine Regression

# A full 60-market replay is expensive; only validate the newest branch commit.
concurrency:
  group: market-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, work/daily-quality-setups-rebuild-20261116]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (production-default same-candle sweep reclaim)
        # Keep replay conditions identical to the live engine. Delayed reclaim is
        # experimental and is not enabled unless a separate controlled comparison validates it.
        run: npm run test:market-engine-replay -- --exchange=bybit --universe-limit=60 --bars=9000 --forward-bars=168 --history-candles=20000 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        if: always()
        run: |
          set +e
          npm run test:market-engine-live
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "Live Bybit diagnostic skipped because the hosted runner is geo-blocked; no live-market conclusion was produced."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Production build
        if: always()
        run: npm run build
