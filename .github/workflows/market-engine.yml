name: Market Engine Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Market structure bias guard
        run: npm run test:market-structure-guard
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (external Bybit data)
        # This replay depends on a third-party exchange endpoint that can block
        # hosted CI runners. Keep it visible as a diagnostic without allowing
        # exchange availability to mask deterministic regression-test results.
        continue-on-error: true
        run: npm run test:market-engine-replay -- --bars=240 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        if: always()
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        if: always()
        run: npm run build
