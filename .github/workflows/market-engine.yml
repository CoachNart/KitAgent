name: Market Engine Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Live strategy rejection matrix
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        run: npm run build
