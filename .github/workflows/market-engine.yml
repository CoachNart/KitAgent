name: Market Engine Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Bybit CSV replay input tests
        run: npm run test:replay-bybit-csv
      - name: Install tools for public Bybit archive
        run: python -m pip install --user pandas pyarrow
      - name: Download current archived Bybit perpetual candles
        run: |
          set -euo pipefail
          mkdir -p bybit-archive-data
          for symbol in BTCUSDT ETHUSDT; do
            file_symbol="${symbol%USDT}_USDT_USDT"
            for spec in "1h:1H" "4h:4H" "1d:1D"; do
              remote_tf="${spec%%:*}"
              local_tf="${spec##*:}"
              url="https://huggingface.co/datasets/rogerdehe/klines-bybit/resolve/main/futures/${remote_tf}/${file_symbol}.parquet"
              curl --fail --location --silent --show-error --retry 3 "$url" -o "bybit-archive-data/${symbol}_${local_tf}.parquet"
            done
          done
      - name: Convert archived Bybit Parquet to replay CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("bybit-archive-data")
          for symbol in ("BTCUSDT", "ETHUSDT"):
              for tf in ("1H", "4H", "1D"):
                  path = root / f"{symbol}_{tf}.parquet"
                  df = pd.read_parquet(path)
                  df.columns = [str(c).strip().lower() for c in df.columns]
                  time_col = next((c for c in ("date", "timestamp", "time", "starttime") if c in df.columns), None)
                  if time_col is None:
                      raise RuntimeError(f"{path}: no timestamp column; columns={list(df.columns)}")
                  if pd.api.types.is_numeric_dtype(df[time_col]):
                      unit = "ms" if df[time_col].abs().max() > 10**11 else "s"
                      stamp = pd.to_datetime(df[time_col], unit=unit, utc=True, errors="coerce")
                  else:
                      stamp = pd.to_datetime(df[time_col], utc=True, errors="coerce")
                  df["timestamp"] = (stamp.astype("int64") // 1_000_000).where(stamp.notna())
                  required = ["open", "high", "low", "close"]
                  missing = [c for c in required if c not in df.columns]
                  if missing:
                      raise RuntimeError(f"{path}: missing OHLC columns {missing}")
                  if "volume" not in df.columns:
                      df["volume"] = 0
                  df = df.dropna(subset=["timestamp"] + required)
                  df = df.sort_values("timestamp").drop_duplicates("timestamp")
                  if len(df) < 80:
                      raise RuntimeError(f"{path}: only {len(df)} candles")
                  latest = pd.to_datetime(int(df["timestamp"].iloc[-1]), unit="ms", utc=True)
                  if latest.year < 2026:
                      raise RuntimeError(f"{path}: dataset is stale; latest candle is {latest.isoformat()}")
                  out = df[["timestamp", "open", "high", "low", "close", "volume"]]
                  out.to_csv(root / f"{symbol}_{tf}.csv", index=False)
                  print(f"{symbol} {tf}: {len(out)} candles, latest {latest.isoformat()}")
          PY
      - name: Prepare 2-hour candles from archived Bybit 1-hour data
        run: node scripts/prepare-bybit-archive-replay.mjs
      - name: Historical replay on recent archived Bybit candles (BTC and ETH)
        continue-on-error: true
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --bars=240 --history-candles=3000 --round-trip-cost-bps=10 2>&1 | tee bybit-replay-report.txt
      - name: Focused 1,000-bar replay for core strategies
        continue-on-error: true
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --timeframes=1H,2H,4H --strategies=TOP_DOWN,PULLBACK,MSNR --bars=1000 --bars-by-timeframe=1H:1000,2H:500,4H:250 --history-candles=3000 --round-trip-cost-bps=10 2>&1 | tee bybit-focused-replay-report.txt
      - name: Chronological research window (July 2026)
        continue-on-error: true
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --timeframes=1H,2H,4H --strategies=TOP_DOWN,PULLBACK,MSNR --bars=1000 --bars-by-timeframe=1H:1000,2H:500,4H:250 --history-candles=3000 --round-trip-cost-bps=10 --decision-start=2026-07-01T00:00:00Z --decision-end=2026-08-01T00:00:00Z 2>&1 | tee bybit-july-replay-report.txt
      - name: Chronological validation window (August 2026)
        continue-on-error: true
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --timeframes=1H,2H,4H --strategies=TOP_DOWN,PULLBACK,MSNR --bars=1000 --bars-by-timeframe=1H:1000,2H:500,4H:250 --history-candles=3000 --round-trip-cost-bps=10 --decision-start=2026-08-01T00:00:00Z --decision-end=2026-09-01T00:00:00Z 2>&1 | tee bybit-august-replay-report.txt
      - name: Chronological holdout window (September to mid-October 2026)
        continue-on-error: true
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --timeframes=1H,2H,4H --strategies=TOP_DOWN,PULLBACK,MSNR --bars=1000 --bars-by-timeframe=1H:1000,2H:500,4H:250 --history-candles=3000 --round-trip-cost-bps=10 --decision-start=2026-09-01T00:00:00Z --decision-end=2026-10-15T00:00:00Z 2>&1 | tee bybit-holdout-replay-report.txt
      - name: Upload historical replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-historical-replay-report
          path: |
            bybit-replay-report.txt
            bybit-focused-replay-report.txt
            bybit-july-replay-report.txt
            bybit-august-replay-report.txt
            bybit-holdout-replay-report.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish historical replay expectancy summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          reports = [
              ("Recent", "bybit-replay-report.txt"),
              ("Focused", "bybit-focused-replay-report.txt"),
              ("July research", "bybit-july-replay-report.txt"),
              ("August validation", "bybit-august-replay-report.txt"),
              ("Sep–Oct holdout", "bybit-holdout-replay-report.txt"),
          ]
          rows = []
          for label, filename in reports:
              path = Path(filename)
              if not path.exists():
                  rows.append((label, None))
                  continue
              content = path.read_text(errors="replace")
              matches = re.findall(r"SUMMARY\\s+(\\{.*?\\n\\})", content, re.S)
              summary = None
              for match in matches:
                  try:
                      summary = json.loads(match)
                  except json.JSONDecodeError:
                      pass
              rows.append((label, summary))

          lines = ["## Historical Bybit replay — research status", "",
                   "These replay jobs are diagnostic and intentionally do not make the build green/red based on strategy expectancy. A successful build is not evidence of a profitable strategy.", "",
                   "| Window | Evaluated | Candidates | Resolved | Wins | Losses | Win rate | Average net R | Status |",
                   "|---|---:|---:|---:|---:|---:|---:|---:|---|"]
          any_negative = False
          for label, s in rows:
              if not s:
                  lines.append(f"| {label} | — | — | — | — | — | — | — | Report unavailable |")
                  continue
              net = s.get("averageNetR")
              negative = isinstance(net, (int, float)) and net <= 0
              any_negative |= negative
              status = "NEGATIVE/NO POSITIVE EDGE" if negative else "Positive in this sample only"
              lines.append(f"| {label} | {s.get('evaluated','—')} | {s.get('candidates','—')} | {s.get('resolved','—')} | {s.get('wins','—')} | {s.get('losses','—')} | {s.get('winRatePct','—')}% | {net} | {status} |")
          lines += ["", "**Interpretation:** negative net expectancy means this replay does not support calling the setup engine ready. Results exclude funding, exact bid/ask spread, partial fills, fee-tier variation, and portfolio-level overlap. Do not tune against the holdout window and reuse it as independent evidence.", ""]
          with open("$GITHUB_STEP_SUMMARY", "a") as f:
              f.write("\\n".join(lines) + "\\n")
          print("Historical replay summary published; expectancy status:", "negative or unavailable" if any_negative else "review report rows")
          PY
      - name: Market structure bias guard
        if: always()
        run: npm run test:market-structure-guard
      - name: Signal outcome regression suite
        if: always()
        run: npm run test:signal-outcomes
      - name: Live strategy rejection matrix
        if: always()
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        if: always()
        run: npm run build
