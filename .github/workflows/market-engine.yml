name: Market Engine Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Bybit CSV replay input tests
        run: npm run test:replay-bybit-csv
      - name: Download archived Bybit candles for reproducible replay
        run: |
          mkdir -p bybit-archive-data
          for symbol in BTCUSDT ETHUSDT; do
            for suffix in 60 240 D; do
              curl --fail --location --silent --show-error --retry 3 \
                "https://raw.githubusercontent.com/mestoness/btc-eth-candles-history/master/${symbol}_${suffix}.csv" \
                -o "bybit-archive-data/${symbol}_${suffix}.csv"
            done
            cp "bybit-archive-data/${symbol}_60.csv" "bybit-archive-data/${symbol}_1H.csv"
            cp "bybit-archive-data/${symbol}_240.csv" "bybit-archive-data/${symbol}_4H.csv"
            cp "bybit-archive-data/${symbol}_D.csv" "bybit-archive-data/${symbol}_1D.csv"
          done
      - name: Prepare 2-hour candles from archived Bybit 1-hour data
        run: node scripts/prepare-bybit-archive-replay.mjs
      - name: Historical replay on archived Bybit candles (BTC and ETH)
        run: npm run test:market-engine-replay -- --data-dir=./bybit-archive-data --symbols=BTCUSDT,ETHUSDT --bars=240 --history-candles=3000 --round-trip-cost-bps=10
      - name: Market structure bias guard
        run: npm run test:market-structure-guard
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (external Bybit data)
        # This replay depends on a third-party exchange endpoint that can block
        # hosted CI runners. Keep it visible as a diagnostic without allowing
        # exchange availability to mask deterministic regression-test results.
        continue-on-error: true
        run: npm run test:market-engine-replay -- --bars=240 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        if: always()
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        if: always()
        run: npm run build
