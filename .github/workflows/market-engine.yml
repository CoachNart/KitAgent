name: Market Engine Regression

on:
  push:
    branches: [main, work/daily-quality-setups-rebuild-20261116]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (Bybit; performance gate)
        # A green workflow must include a real, resolved historical sample with
        # positive net expectancy after costs. API/network failures and weak
        # performance are intentionally visible as a failed gate.
        run: npm run test:market-engine-replay -- --symbols=BTCUSDT,ETHUSDT,SOLUSDT --bars=240 --forward-bars=168 --history-candles=1500 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        if: always()
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        if: always()
        run: npm run build
