name: Market Engine Regression

on:
  push:
    branches: [main, work/daily-quality-setups-rebuild-20261116]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (OKX test data; live execution remains Bybit)
        # Keep the established 60-market replay scope fixed. Improve the engine,
        # not the sample size, to address the executable/resolved trade bottleneck.
        run: npm run test:market-engine-replay -- --universe-limit=60 --bars=4000 --forward-bars=168 --history-candles=5000 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        if: always()
        run: |
          set +e
          npm run test:market-engine-live
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "Live Bybit diagnostic skipped because the hosted runner is geo-blocked; no live-market conclusion was produced."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Production build
        if: always()
        run: npm run build
