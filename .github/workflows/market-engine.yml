name: Market Engine Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Market engine regression suite
        run: npm run test:market-engine
      - name: Signal outcome regression suite
        run: npm run test:signal-outcomes
      - name: Historical market replay (public futures candles)
        run: npm run test:market-engine-replay -- --symbols=BTCUSDT,ETHUSDT,SOLUSDT --bars=200 --round-trip-cost-bps=10
      - name: Live strategy rejection matrix
        continue-on-error: true
        run: npm run test:market-engine-live
      - name: Production build
        run: npm run build
