name: Migrate NFT surface to perpetuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: node scripts/replace-nft-with-perps.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PerpetualsPage.jsx scripts/switch-perps-to-hyperliquid.mjs scripts/tighten-perps-ui.mjs scripts/fix-hl-migration-script.mjs
          git diff --cached --quiet || git commit -m "feat: switch perpetual terminal to Hyperliquid and polish UI [skip ci]"
          git push
