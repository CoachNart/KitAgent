name: Migrate NFT surface to perpetuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hyperliquid migration only when needed
        run: |
          if grep -q "wss://stream.bybit.com\|/api/bybit" src/PerpetualsPage.jsx; then
            node scripts/replace-nft-with-perps.mjs
          else
            echo "Perpetual terminal is already on Hyperliquid; preserving the existing terminal UI."
          fi
      - name: Fix live 24h High/Low
        run: node scripts/fix-perps-24h-range.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PerpetualsPage.jsx scripts/replace-nft-with-perps.mjs scripts/switch-perps-to-hyperliquid.mjs scripts/tighten-perps-ui.mjs scripts/fix-hl-migration-script.mjs scripts/fix-perps-24h-range.mjs .github/workflows/migrate-perps.yml
          git diff --cached --quiet || git commit -m "fix: finalize Hyperliquid perps terminal and live 24h range [skip ci]"
          git push
