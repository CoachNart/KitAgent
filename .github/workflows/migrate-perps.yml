name: Migrate NFT surface to perpetuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && (contains(github.event.head_commit.message, 'restore exact Bybit terminal') || contains(github.event.head_commit.message, 'restore Bybit terminal') || contains(github.event.head_commit.message, 'Hyperliquid engine')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact legacy terminal and swap provider
        run: node scripts/switch-perps-to-hyperliquid.mjs
      - name: Fix live 24h High/Low
        run: node scripts/fix-perps-24h-range.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PerpetualsPage.jsx scripts/switch-perps-to-hyperliquid.mjs scripts/replace-nft-with-perps.mjs scripts/tighten-perps-ui.mjs scripts/fix-hl-migration-script.mjs scripts/fix-perps-24h-range.mjs .github/workflows/migrate-perps.yml
          git diff --cached --quiet || git commit -m "fix: restore exact Bybit terminal UI with Hyperliquid execution [skip ci]"
          git push
