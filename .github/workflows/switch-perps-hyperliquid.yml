name: Switch Perpetuals to Hyperliquid
on:
  push:
    branches: [main]
    paths:
      - 'scripts/switch-perps-to-hyperliquid.mjs'
      - '.github/workflows/switch-perps-hyperliquid.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/switch-perps-to-hyperliquid.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/App.jsx
            if git diff --cached --quiet; then echo 'Hyperliquid route already applied.'; exit 0; fi
            git commit -m 'feat: switch perpetuals execution to Hyperliquid'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep 3
          done
          echo 'Could not push Hyperliquid route after retries.'
          exit 1
