name: Fix navigation icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: correct home and profile nav icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct home and profile icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('Terminal, UserRound, Wallet', 'Terminal, UserRound, House, Wallet')
          s = s.replace("['home','Home',UserRound]", "['home','Home',House]")
          p.write_text(s)
          PY
      - name: Commit icon fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct home and profile nav icons'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-nav-icons.yml
          git commit -m 'chore: remove one-time nav icon workflow'
          git push
