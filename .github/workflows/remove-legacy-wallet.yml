name: Remove legacy wallet connector
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, 'legacy wallet removal') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/remove-legacy-wallet.mjs
      - run: npm install
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/walletConnector.js
          git diff --cached --quiet || git commit -m 'fix: remove legacy wallet connection [skip ci]'
          git push
