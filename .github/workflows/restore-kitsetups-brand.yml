name: Restore KitSetups brand
on:
  push:
    branches: [main]
    paths:
      - scripts/restore-kitsetups-brand.mjs
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-kitsetups-brand.mjs
      - name: Commit brand rename and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f scripts/restore-kitsetups-brand.mjs .github/workflows/restore-kitsetups-brand.yml
          git commit -m "chore: restore KitSetups branding [skip ci]" || exit 0
          git push
