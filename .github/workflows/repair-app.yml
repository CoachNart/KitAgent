name: Repair App source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete App source and remove duplicate import
        run: |
          git checkout cc786c2d285bf89a40963f7c7476a0f32736305d -- src/App.jsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          needle="import PerpetualsPage from './PerpetualsPage.jsx';\n"
          first=s.find(needle)
          second=s.find(needle, first+len(needle))
          if second != -1:
              s=s[:second]+s[second+len(needle):]
          p.write_text(s)
          PY
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "fix: restore complete App source after import repair [skip ci]"
          git push
